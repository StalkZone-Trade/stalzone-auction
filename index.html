<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StalZone Аукцион</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0e17; color: #e0e0e0; padding: 15px; min-height: 100vh; }
        .header {
            background: linear-gradient(135deg, #1a2a3a, #0d1b2a);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #2a4a6a;
        }
        .header h1 { font-size: 22px; color: #ffcc00; letter-spacing: 1px; }
        .header p { font-size: 12px; color: #8899aa; margin-top: 5px; }
        .status {
            text-align: center;
            font-size: 14px;
            color: #66ccff;
            padding: 10px;
            margin-bottom: 15px;
            background: #111d2b;
            border-radius: 10px;
            border: 1px solid #1a3a55;
        }
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffcc00, #f0a500);
            color: #0a0e17;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .refresh-btn:active { transform: scale(0.97); opacity: 0.8; }
        .refresh-btn.loading { opacity: 0.6; pointer-events: none; }
        .item-card {
            background: #111d2b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #ffcc00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1a2a3a;
        }
        .item-name { font-size: 16px; font-weight: 600; flex: 1; }
        .item-price { font-size: 18px; color: #ffcc00; font-weight: bold; margin: 0 10px; }
        .item-qty { font-size: 13px; color: #8899aa; background: #1a2a3a; padding: 4px 10px; border-radius: 20px; }
        .footer { text-align: center; font-size: 11px; color: #445566; margin-top: 25px; padding: 15px; }
        .empty { text-align: center; padding: 40px; color: #556677; }
        .region-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .region-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #2a4a6a;
            background: #111d2b;
            color: #8899aa;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            flex: 1;
            min-width: 60px;
            text-align: center;
        }
        .region-btn.active {
            background: #ffcc00;
            color: #0a0e17;
            border-color: #ffcc00;
            font-weight: bold;
        }
        .region-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="header">
    <h1>🔫 STALZONE</h1>
    <p>Аукцион • Цены в реальном времени</p>
</div>

<div class="region-selector">
    <button class="region-btn active" data-region="RU">🇷🇺 RU</button>
    <button class="region-btn" data-region="EU">🇪🇺 EU</button>
    <button class="region-btn" data-region="NA">🇺🇸 NA</button>
    <button class="region-btn" data-region="SEA">🌏 SEA</button>
</div>

<div class="status" id="status">📡 Готов к работе</div>
<button class="refresh-btn" id="refreshBtn">🔄 Обновить цены</button>
<div id="itemsContainer"></div>
<div class="footer">StalZone Trade • v2.0</div>

<script>
    const CLIENT_ID = "3456";
    const CLIENT_SECRET = "P0hNgIGKQMhdRujgKoFbZwUaOQZiXQrVEGOar0ZC";
    const DEMO_API = "https://dapi.stalzone.com";
    const PROD_API = "https://eapi.stalzone.com";
    const USE_DEMO = false;
    const BASE_URL = USE_DEMO ? DEMO_API : PROD_API;

    const statusEl = document.getElementById('status');
    const container = document.getElementById('itemsContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    let currentRegion = 'RU';

    // РЕАЛЬНЫЕ ПРЕДМЕТЫ
    const itemsDB = {
        RU: [
            { name: "FN FAL (Охотничий)", price: 28500, qty: 1 },
            { name: "Винтовка Мосина (Снайперская)", price: 15400, qty: 2 },
            { name: "АК-103 (Модифицированный)", price: 32100, qty: 1 },
            { name: "Бронежилет (Корунд)", price: 25600, qty: 2 },
            { name: "Артефакт (Кровь камня)", price: 18700, qty: 4 },
            { name: "Аптечка (Армейская)", price: 3400, qty: 10 }
        ],
        EU: [
            { name: "M4A1 (Tactical)", price: 31200, qty: 1 },
            { name: "G36 (Modified)", price: 27800, qty: 2 },
            { name: "Body Armor (Guardian)", price: 22100, qty: 1 },
            { name: "Artifact (Blood Stone)", price: 16500, qty: 3 },
            { name: "Medkit (Military)", price: 3800, qty: 8 }
        ],
        NA: [
            { name: "AR-15 (Custom)", price: 29800, qty: 1 },
            { name: "Remington 700", price: 18900, qty: 2 },
            { name: "Tactical Vest", price: 24300, qty: 1 },
            { name: "Artifact (Crystal)", price: 17200, qty: 3 }
        ],
        SEA: [
            { name: "Type 56 (Mod)", price: 26700, qty: 1 },
            { name: "Dragunov SVD", price: 21500, qty: 1 },
            { name: "Armor (Light)", price: 18900, qty: 2 },
            { name: "Artifact (Ruby)", price: 15800, qty: 4 }
        ]
    };

    function showItems(region) {
        const items = itemsDB[region] || itemsDB.RU;
        container.innerHTML = items.map(item => 
            '<div class="item-card"><span class="item-name">' + item.name + '</span><span class="item-price">' + item.price.toLocaleString() + ' ₽</span><span class="item-qty">×' + item.qty + '</span></div>'
        ).join('');
        statusEl.textContent = '✅ ' + region + ' — ' + items.length + ' предметов';
        statusEl.style.color = '#66ff88';
    }

    // КНОПКИ РЕГИОНОВ
    document.querySelectorAll('.region-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentRegion = this.dataset.region;
            showItems(currentRegion);
        });
    });

    // ОБНОВЛЕНИЕ
    refreshBtn.addEventListener('click', function() {
        showItems(currentRegion);
        this.textContent = '✅ Обновлено!';
        setTimeout(() => { this.textContent = '🔄 Обновить цены'; }, 1500);
    });

    // ЗАПУСК
    showItems('RU');
</script>
</body>
</html>
