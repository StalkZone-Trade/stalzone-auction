<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StalZone Аукцион</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0e17; color: #e0e0e0; padding: 15px; min-height: 100vh; }
        .header {
            background: linear-gradient(135deg, #1a2a3a, #0d1b2a);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #2a4a6a;
        }
        .header h1 { font-size: 22px; color: #ffcc00; letter-spacing: 1px; }
        .header p { font-size: 12px; color: #8899aa; margin-top: 5px; }
        .status {
            text-align: center;
            font-size: 14px;
            padding: 10px;
            margin-bottom: 15px;
            background: #111d2b;
            border-radius: 10px;
            border: 1px solid #1a3a55;
            min-height: 40px;
        }
        .status.loading { color: #66ccff; }
        .status.success { color: #66ff88; }
        .status.error { color: #ff6666; }
        .status.info { color: #ffcc00; }
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffcc00, #f0a500);
            color: #0a0e17;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .refresh-btn:active { transform: scale(0.97); opacity: 0.8; }
        .refresh-btn.loading { opacity: 0.6; pointer-events: none; }
        .item-card {
            background: #111d2b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #ffcc00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1a2a3a;
            transition: all 0.2s;
        }
        .item-card:active { transform: scale(0.98); }
        .item-name { font-size: 16px; font-weight: 600; flex: 1; }
        .item-price { font-size: 18px; color: #ffcc00; font-weight: bold; margin: 0 10px; }
        .item-qty { font-size: 13px; color: #8899aa; background: #1a2a3a; padding: 4px 10px; border-radius: 20px; }
        .footer { text-align: center; font-size: 11px; color: #445566; margin-top: 25px; padding: 15px; }
        .empty { text-align: center; padding: 40px; color: #556677; }
        .region-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .region-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #2a4a6a;
            background: #111d2b;
            color: #8899aa;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            flex: 1;
            min-width: 60px;
            text-align: center;
        }
        .region-btn:active { transform: scale(0.95); }
        .region-btn.active {
            background: #ffcc00;
            color: #0a0e17;
            border-color: #ffcc00;
            font-weight: bold;
        }
        .debug-box {
            background: #0a0e17;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            font-size: 11px;
            color: #445566;
            max-height: 150px;
            overflow: auto;
            display: none;
        }
        .debug-box.show { display: block; }
        .debug-box pre {
            white-space: pre-wrap;
            word-break: break-all;
            color: #66ccff;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🔫 STALZONE</h1>
    <p>Аукцион • Цены в реальном времени</p>
</div>

<div class="region-selector">
    <button class="region-btn active" data-region="RU">🇷🇺 RU</button>
    <button class="region-btn" data-region="EU">🇪🇺 EU</button>
    <button class="region-btn" data-region="NA">🇺🇸 NA</button>
    <button class="region-btn" data-region="SEA">🌏 SEA</button>
</div>

<div class="status" id="status">📡 Готов к работе</div>
<button class="refresh-btn" id="refreshBtn">🔄 Обновить цены</button>
<div id="itemsContainer"><div class="empty">⏳ Нажмите "Обновить цены"</div></div>
<div id="debugBox" class="debug-box"></div>
<div class="footer">StalZone Trade • v4.0 • Secret Based Auth</div>

<script>
    // ============================================================
    //  ТВОИ ДАННЫЕ (из Telegram-бота)
    // ============================================================
    const CLIENT_ID = "3456";
    const CLIENT_SECRET = "P0hNgIGKQMhdRujgKoFbZwUaOQZiXQrVEGOar0ZC";
    // ============================================================

    const BASE_URL = "https://eapi.stalzone.com";
    const statusEl = document.getElementById('status');
    const container = document.getElementById('itemsContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const debugBox = document.getElementById('debugBox');
    let currentRegion = 'RU';

    // ---- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----

    function setStatus(text, type = 'info') {
        statusEl.textContent = text;
        statusEl.className = 'status ' + type;
    }

    function debugLog(data) {
        debugBox.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        debugBox.classList.add('show');
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatPrice(price) {
        return Number(price).toLocaleString() + ' ₽';
    }

    // ---- ОСНОВНАЯ ФУНКЦИЯ ЗАГРУЗКИ ----

    async function loadAuction() {
        refreshBtn.classList.add('loading');
        refreshBtn.textContent = '⏳ Загрузка...';
        setStatus('📡 Запрос к ' + currentRegion + '...', 'loading');
        container.innerHTML = '<div class="empty">⏳ Загрузка данных...</div>';

        // Пробуем разные возможные эндпоинты
        const possibleEndpoints = [
            '/auction/items',
            '/items/auction',
            '/auction',
            '/market',
            '/items'
        ];

        let lastError = null;

        for (const endpoint of possibleEndpoints) {
            const url = BASE_URL + '/' + currentRegion + endpoint;
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Client-Id': CLIENT_ID,
                        'Client-Secret': CLIENT_SECRET,
                        'Content-Type': 'application/json'
                    }
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    data = responseText;
                }

                // Если получили успешный ответ
                if (response.ok) {
                    setStatus('✅ Данные получены (' + currentRegion + ')', 'success');
                    renderItems(data);
                    debugLog({ endpoint: url, status: response.status, data: data });
                    refreshBtn.classList.remove('loading');
                    refreshBtn.textContent = '🔄 Обновить цены';
                    return;
                } else {
                    // Если статус 401 или 403 — значит эндпоинт правильный, но нужна авторизация
                    if (response.status === 401 || response.status === 403) {
                        setStatus('⚠️ Требуется авторизация. Проверь Client ID и Secret.', 'error');
                        debugLog({ endpoint: url, status: response.status, data: data });
                        refreshBtn.classList.remove('loading');
                        refreshBtn.textContent = '🔄 Обновить цены';
                        return;
                    }
                    lastError = { endpoint: url, status: response.status, data: data };
                }
            } catch (error) {
                lastError = { endpoint: url, error: error.message };
            }
        }

        // Если ни один эндпоинт не сработал
        setStatus('❌ Не удалось найти эндпоинт для аукциона', 'error');
        container.innerHTML = `
            <div class="empty" style="color:#ff6666;">
                ❌ Не удалось подключиться к API
                <br><br>
                <small style="color:#445566;">Попробуй обновить страницу или проверь интернет</small>
                <br><br>
                <small style="color:#445566;">Регион: ${currentRegion}</small>
            </div>
        `;
        debugLog(lastError);
        refreshBtn.classList.remove('loading');
        refreshBtn.textContent = '🔄 Обновить цены';
    }

    // ---- ОТОБРАЖЕНИЕ ДАННЫХ ----

    function renderItems(data) {
        // Пытаемся извлечь массив предметов из разных форматов
        let items = [];

        if (Array.isArray(data)) {
            items = data;
        } else if (data.items && Array.isArray(data.items)) {
            items = data.items;
        } else if (data.data && Array.isArray(data.data)) {
            items = data.data;
        } else if (data.auction && Array.isArray(data.auction)) {
            items = data.auction;
        } else if (data.lots && Array.isArray(data.lots)) {
            items = data.lots;
        } else if (data.result && Array.isArray(data.result)) {
            items = data.result;
        } else if (data.list && Array.isArray(data.list)) {
            items = data.list;
        } else {
            // Если структура неизвестна — показываем сырые данные
            container.innerHTML = `
                <div class="empty" style="color:#ffcc00;">
                    ⚠️ Неизвестная структура данных
                    <br><br>
                    <small style="color:#445566;">Показываем сырые данные из API</small>
                </div>
            `;
            debugLog(data);
            return;
        }

        if (!items || items.length === 0) {
            container.innerHTML = '<div class="empty">📭 На аукционе нет лотов</div>';
            return;
        }

        // Отображаем до 50 предметов
        const displayItems = items.slice(0, 50);
        container.innerHTML = displayItems.map((item, index) => {
            // Пытаемся извлечь имя, цену и количество
            const name = item.name || item.title || item.item_name || item.id || 'Предмет #' + (index + 1);
            const price = item.price || item.current_price || item.start_price || item.amount || item.buyout || 0;
            const qty = item.quantity || item.qty || item.count || 1;

            return `
                <div class="item-card">
                    <span class="item-name">${escapeHtml(String(name))}</span>
                    <span class="item-price">${formatPrice(price)}</span>
                    <span class="item-qty">×${qty}</span>
                </div>
            `;
        }).join('');

        setStatus(`✅ Показано ${displayItems.length} лотов из ${items.length}`, 'success');
    }

    // ---- КНОПКИ РЕГИОНОВ ----

    document.querySelectorAll('.region-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentRegion = this.dataset.region;
            loadAuction();
        });
    });

    // ---- КНОПКА ОБНОВЛЕНИЯ ----

    refreshBtn.addEventListener('click', loadAuction);

    // ---- АВТОЗАГРУЗКА ПРИ ОТКРЫТИИ ----

    // Загружаем при открытии
    setTimeout(() => {
        loadAuction();
    }, 500);
</script>
</body>
</html>
