<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StalZone Артефакты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0e17; color: #e0e0e0; padding: 15px; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a2a3a, #0d1b2a); padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: center; border: 1px solid #2a4a6a; }
        .header h1 { font-size: 22px; color: #ffcc00; letter-spacing: 1px; }
        .header p { font-size: 12px; color: #8899aa; margin-top: 5px; }
        .status { text-align: center; font-size: 14px; padding: 10px; margin-bottom: 15px; background: #111d2b; border-radius: 10px; border: 1px solid #1a3a55; min-height: 40px; }
        .status.loading { color: #66ccff; }
        .status.success { color: #66ff88; }
        .status.error { color: #ff6666; }
        .status.info { color: #ffcc00; }
        .refresh-btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #ffcc00, #f0a500); color: #0a0e17; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: all 0.3s; }
        .refresh-btn:active { transform: scale(0.97); opacity: 0.8; }
        .refresh-btn.loading { opacity: 0.6; pointer-events: none; }
        .item-card { background: #111d2b; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #ffcc00; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1a2a3a; }
        .item-name { font-size: 16px; font-weight: 600; flex: 1; }
        .item-price { font-size: 18px; color: #ffcc00; font-weight: bold; margin: 0 10px; }
        .item-qty { font-size: 13px; color: #8899aa; background: #1a2a3a; padding: 4px 10px; border-radius: 20px; }
        .item-id { font-size: 10px; color: #445566; margin-top: 2px; }
        .footer { text-align: center; font-size: 11px; color: #445566; margin-top: 25px; padding: 15px; }
        .empty { text-align: center; padding: 40px; color: #556677; }
        .region-selector { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
        .region-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #2a4a6a; background: #111d2b; color: #8899aa; cursor: pointer; font-size: 14px; transition: all 0.3s; flex: 1; min-width: 60px; text-align: center; }
        .region-btn:active { transform: scale(0.95); }
        .region-btn.active { background: #ffcc00; color: #0a0e17; border-color: #ffcc00; font-weight: bold; }
        .debug-box { background: #0a0e17; border: 1px solid #1a2a3a; border-radius: 8px; padding: 10px; margin-top: 15px; font-size: 11px; color: #445566; max-height: 200px; overflow: auto; display: block; }
        .debug-box pre { white-space: pre-wrap; word-break: break-all; color: #66ccff; margin: 0; }
    </style>
</head>
<body>

<div class="header">
    <h1>💎 STALZONE</h1>
    <p>Артефакты • Цены аукциона</p>
</div>

<div class="region-selector">
    <button class="region-btn active" data-region="RU">🇷🇺 RU</button>
    <button class="region-btn" data-region="EU">🇪🇺 EU</button>
    <button class="region-btn" data-region="NA">🇺🇸 NA</button>
    <button class="region-btn" data-region="SEA">🌏 SEA</button>
</div>

<div class="status" id="status">📡 Готов к работе</div>
<button class="refresh-btn" id="refreshBtn">🔄 Обновить цены</button>
<div id="itemsContainer"><div class="empty">⏳ Нажмите "Обновить цены"</div></div>
<div id="debugBox" class="debug-box"><pre>📋 Журнал загрузки...</pre></div>
<div class="footer">StalZone Trade • Артефакты • Secret Auth</div>

<script>
    // ============================================================
    //  ТВОИ ДАННЫЕ ДЛЯ АВТОРИЗАЦИИ
    // ============================================================
    const CLIENT_ID = "3456";
    const CLIENT_SECRET = "P0hNgIGKQMhdRujgKoFbZwUaOQZiXQrVEGOar0ZC";
    const BASE_URL = "https://eapi.stalzone.net";

    // ============================================================
    //  ID АРТЕФАКТОВ (вшиты в код)
    // ============================================================
    const ARTEFACT_IDS = [
        "04yr", // Кровь камня
        "0a1b", // Мамины бусы
        "0b2c", // Кристалл
        "0c3d", // Слеза
        "0d4e", // Коготь
        "0e5f", // Звезда
        "0f6g", // Луна
        "0g7h", // Солнце
        "0h8i", // Глаз
        "0i9j"  // Сердце
    ];

    // ============================================================
    //  НАЗВАНИЯ АРТЕФАКТОВ
    // ============================================================
    const ARTEFACT_NAMES = {
        "04yr": "Кровь камня",
        "0a1b": "Мамины бусы",
        "0b2c": "Кристалл",
        "0c3d": "Слеза",
        "0d4e": "Коготь",
        "0e5f": "Звезда",
        "0f6g": "Луна",
        "0g7h": "Солнце",
        "0h8i": "Глаз",
        "0i9j": "Сердце"
    };

    const statusEl = document.getElementById('status');
    const container = document.getElementById('itemsContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const debugBox = document.getElementById('debugBox');
    let currentRegion = 'RU';
    let debugLogs = [];

    // ============================================================
    //  ОТЛАДКА
    // ============================================================
    function addDebug(text, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : '📌';
        const log = `[${timestamp}] ${prefix} ${text}`;
        debugLogs.push(log);
        debugBox.innerHTML = '<pre>' + debugLogs.join('\n') + '</pre>';
        debugBox.scrollTop = debugBox.scrollHeight;
        console.log(log);
    }

    function clearDebug() {
        debugLogs = [];
        debugBox.innerHTML = '<pre>📋 Журнал загрузки...</pre>';
    }

    function setStatus(text, type = 'info') {
        statusEl.textContent = text;
        statusEl.className = 'status ' + type;
    }

    // ============================================================
    //  ЗАГРУЗКА ИСТОРИИ ЦЕН (С АВТОРИЗАЦИЕЙ)
    // ============================================================
    async function loadPriceHistory(itemId, region) {
        try {
            const url = `${BASE_URL}/${region}/auction/${itemId}/history?limit=1`;
            addDebug(`📡 Запрос к API: ${url}`, 'info');
            
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Client-Id': CLIENT_ID,
                    'Client-Secret': CLIENT_SECRET,
                    'Content-Type': 'application/json'
                }
            });

            addDebug(`📊 Статус ответа: ${response.status}`, response.ok ? 'success' : 'warning');

            if (!response.ok) {
                if (response.status === 401) {
                    addDebug(`❌ Ошибка авторизации! Проверь Client ID и Secret`, 'error');
                } else if (response.status === 404) {
                    addDebug(`⚠️ Предмет ${itemId} не найден в регионе ${region}`, 'warning');
                } else {
                    addDebug(`⚠️ Ошибка ${response.status} для ${itemId}`, 'warning');
                }
                return null;
            }

            const data = await response.json();
            addDebug(`✅ Данные получены для ${itemId}`, 'success');
            return data;
        } catch (error) {
            addDebug(`❌ Ошибка соединения: ${error.message}`, 'error');
            return null;
        }
    }

    // ============================================================
    //  ОСНОВНАЯ ФУНКЦИЯ
    // ============================================================
    async function loadAuction() {
        clearDebug();
        addDebug(`🚀 Запуск для региона ${currentRegion}`);
        addDebug(`🔑 Client ID: ${CLIENT_ID}`);
        addDebug(`🔗 API URL: ${BASE_URL}`);
        addDebug(`🔐 Метод авторизации: Secret Based Auth (Client-Id + Client-Secret)`);

        refreshBtn.classList.add('loading');
        refreshBtn.textContent = '⏳ Загрузка...';
        setStatus('📡 Загрузка цен артефактов...', 'loading');
        container.innerHTML = '<div class="empty">⏳ Загрузка...</div>';

        try {
            const results = [];
            let loaded = 0;
            let withPrice = 0;
            let authErrors = 0;

            for (const itemId of ARTEFACT_IDS) {
                const name = ARTEFACT_NAMES[itemId] || itemId;
                addDebug(`📡 Запрос цены для ${name} (${itemId})...`);
                
                const priceData = await loadPriceHistory(itemId, currentRegion);
                let price = 0;
                let qty = 1;

                if (priceData && Array.isArray(priceData) && priceData.length > 0) {
                    const last = priceData[0];
                    price = last.price || last.amount || 0;
                    qty = last.quantity || last.qty || 1;
                    if (price > 0) {
                        withPrice++;
                        addDebug(`✅ ${name}: ${price} ₽ (x${qty})`, 'success');
                    } else {
                        addDebug(`ℹ️ ${name}: цена 0 (нет продаж)`, 'info');
                    }
                } else if (priceData === null) {
                    // Если вернулось null, значит была ошибка
                    authErrors++;
                }

                results.push({ id: itemId, name: name, price: price, qty: qty });
                loaded++;
            }

            addDebug(`📊 Итог: ${results.length} артефактов, с ценами: ${withPrice}, ошибок: ${authErrors}`);

            if (authErrors === ARTEFACT_IDS.length) {
                setStatus('❌ Все запросы вернули ошибку. Проверь авторизацию!', 'error');
                container.innerHTML = `
                    <div class="empty" style="color:#ff6666;">
                        ❌ Ошибка авторизации
                        <br><br>
                        <small style="color:#445566;">Проверь Client ID и Client Secret</small>
                        <br>
                        <small style="color:#445566;">Убедись, что приложение одобрено в Telegram-боте</small>
                    </div>
                `;
                refreshBtn.classList.remove('loading');
                refreshBtn.textContent = '🔄 Обновить цены';
                return;
            }

            const filtered = results.filter(item => item.price > 0);
            const sorted = filtered.sort((a, b) => b.price - a.price);

            if (sorted.length === 0) {
                setStatus(`⚠️ Нет активных лотов для региона ${currentRegion}`, 'warning');
                container.innerHTML = `
                    <div class="empty">
                        📭 Нет активных лотов в регионе ${currentRegion}
                        <br><br>
                        <small style="color:#445566;">Попробуй другой регион</small>
                        <br>
                        <small style="color:#445566;">Или добавь другие ID артефактов</small>
                    </div>
                `;
                refreshBtn.classList.remove('loading');
                refreshBtn.textContent = '🔄 Обновить цены';
                return;
            }

            const displayItems = sorted.slice(0, 50);
            container.innerHTML = displayItems.map(item => {
                return `
                    <div class="item-card">
                        <div>
                            <div class="item-name">${escapeHtml(item.name)}</div>
                            <div class="item-id">ID: ${item.id}</div>
                        </div>
                        <span class="item-price">${formatPrice(item.price)}</span>
                        <span class="item-qty">×${item.qty}</span>
                    </div>
                `;
            }).join('');

            addDebug(`✅ Показано ${displayItems.length} артефактов`, 'success');
            setStatus(`✅ Показано ${displayItems.length} артефактов (всего с ценами: ${sorted.length})`, 'success');

        } catch (error) {
            addDebug(`❌ КРИТИЧЕСКАЯ ОШИБКА: ${error.message}`, 'error');
            setStatus('❌ Ошибка загрузки', 'error');
            container.innerHTML = `<div class="empty" style="color:#ff6666;">❌ Ошибка: ${error.message}</div>`;
        }

        refreshBtn.classList.remove('loading');
        refreshBtn.textContent = '🔄 Обновить цены';
    }

    // ============================================================
    //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatPrice(price) {
        return Number(price).toLocaleString() + ' ₽';
    }

    // ============================================================
    //  КНОПКИ
    // ============================================================
    document.querySelectorAll('.region-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentRegion = this.dataset.region;
            loadAuction();
        });
    });

    refreshBtn.addEventListener('click', loadAuction);

    setTimeout(() => {
        loadAuction();
    }, 500);
</script>
</body>
</html>
